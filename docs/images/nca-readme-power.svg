<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
<title id="title">RAM showdown: nca 6.4 MB, Grok CLI 59 MB, Claude Code 162 MB, Cursor CLI not sampled</title>
<desc id="desc">RAM footprint of one turn per CLI on one shared scale. The nca bar is the shortest. Cursor CLI was not sampled, so it has no bar.</desc>
<defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#1d4740"/></pattern></defs>
<style>.title{font:700 26px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#34e0b0}.sub{font:400 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9aa3a8}.name{font:600 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6ecea}.name.nca{fill:#34e0b0}.value{font:700 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6ecea}.value.nca{fill:#34e0b0}.callout{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#34e0b0}.unsampled{fill:none;stroke:#9aa3a8;stroke-width:2;stroke-dasharray:7 6}.note{font:italic 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9aa3a8}.foot{font:400 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9aa3a8}.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s ease-out both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="960" height="420" fill="#0a1112"/><rect width="960" height="420" fill="url(#dots)" opacity=".35"/><text class="title" x="40" y="56">RAM showdown</text><text class="sub" x="40" y="84">RAM footprint, one turn per CLI. Shorter bar wins.</text><line x1="230" y1="122" x2="230" y2="372" stroke="#1d4740"/><text class="name nca" x="40" y="156">nca</text><rect class="bar" x="230" y="136" width="20.5" height="28" rx="3" fill="#34e0b0" style="animation-delay:0.2s"/><text class="value nca" x="262.5" y="156">6.4 MB</text><text class="callout" x="346.5" y="156">25× less RAM than Claude Code · 9× less than Grok CLI</text><text class="name" x="40" y="220">Grok CLI</text><rect class="bar" x="230" y="200" width="189.4" height="28" rx="3" fill="#3b4b4f" style="animation-delay:0.5s"/><text class="value" x="431.4" y="220">59 MB</text><text class="name" x="40" y="284">Claude Code</text><rect class="bar" x="230" y="264" width="520.0" height="28" rx="3" fill="#3b4b4f" style="animation-delay:0.8s"/><text class="value" x="762.0" y="284">162 MB</text><text class="name" x="40" y="348">Cursor CLI</text><rect class="unsampled" x="230" y="328" width="520" height="28" rx="3"/><text class="note" x="244" y="348">not sampled (startup only)</text><text class="foot" x="40" y="392">One footprint sample per CLI, 1.5–3 s into each run (macOS). Wall time is left out: it follows each model.</text><text class="foot" x="40" y="412">nca used kenari.id (minimax-m3-1-flash). The other CLIs used their default models.</text>
</svg>
